version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: project20-postgres
    environment:
      POSTGRES_DB: ${DB_NOME}
      POSTGRES_USER: ${DB_USUARIO}
      POSTGRES_PASSWORD: ${DB_SENHA}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    restart: unless-stopped

  # Só as mensagens do chat (task 135). Segurança desligada: serviço de desenvolvimento, nunca exposto.
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: project20-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_dados:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_dados:
  opensearch_dados:
