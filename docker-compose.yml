version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: project20-postgres
    environment:
      POSTGRES_DB: ${DB_NOME}
      POSTGRES_USER: ${DB_USUARIO}
      POSTGRES_PASSWORD: ${DB_SENHA}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_dados:
