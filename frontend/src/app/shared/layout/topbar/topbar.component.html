<header class="topbar flex items-center px-6 py-3 border-b-2 gap-6">
  <!-- Logo -->
  <a routerLink="/atividade" class="topbar__logo flex-shrink-0">
    <img src="favicon.ico" alt="Logo" class="topbar__logo-imagem" />
  </a>

  <!-- Navigation -->
  <nav class="topbar__nav flex items-center gap-1 flex-1">
    @for (item of itensNavegacao(); track item.rotaLink) {
      <a
        [routerLink]="item.rotaLink"
        routerLinkActive="topbar__nav-item--ativo"
        class="topbar__nav-item flex items-center gap-2 px-3 py-2 rounded-lg text-color hover:bg-emphasis transition-colors text-sm font-medium whitespace-nowrap"
      >
        <i [class]="item.icone"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Actions -->
  <div class="topbar__acoes flex items-center gap-2 flex-shrink-0">
    <span class="topbar__hora text-sm text-muted-color font-mono tabular-nums">{{ horaAtual() }}</span>

    <p-button
      icon="pi pi-user"
      severity="secondary"
      [text]="true"
      size="small"
      [pTooltip]="sessao.nomeCompleto() ?? ''"
      tooltipPosition="left"
      (onClick)="perfilPopover.toggle($event)"
    />

    <p-popover #perfilPopover>
      @if (sessao.usuarioAtual()) {
        <div class="flex flex-col gap-3 p-1 min-w-[180px]">
          <div>
            <div class="font-semibold text-color">{{ sessao.nomeCompleto() }}</div>
            <div class="text-sm text-muted-color">&#64;{{ sessao.login() }}</div>
          </div>
          <p-divider class="my-0" />
          <div class="flex items-center gap-2 text-sm text-muted-color">
            <i class="pi pi-id-card text-xs"></i>
            <span>{{ sessao.eGestor() ? 'Gestor' : 'Desenvolvedor' }}</span>
          </div>
          <button
            type="button"
            class="topbar__link-anotacoes flex items-center gap-2 text-sm"
            (click)="perfilPopover.hide(); anotacoesDialog.abrir(sessao.id()!, sessao.nomeCompleto()!)"
          >
            <i class="pi pi-file-edit text-xs"></i>
            <span>Minhas Anotações</span>
          </button>
          <button
            type="button"
            class="topbar__tema flex items-center gap-2 text-sm"
            (click)="tema.alternarTema()"
          >
            <i class="text-xs" [class]="tema.eEscuro() ? 'pi pi-sun' : 'pi pi-moon'"></i>
            <span>{{ tema.eEscuro() ? 'Tema claro' : 'Tema escuro' }}</span>
          </button>
        </div>
      }
    </p-popover>

    <p-button
      icon="pi pi-sign-out"
      severity="secondary"
      [text]="true"
      size="small"
      pTooltip="Sair"
      tooltipPosition="left"
      (onClick)="sair()"
    />
  </div>
</header>

<app-usuario-anotacoes-dialog #anotacoesDialog />
