@if (execucaoAtiva.primeiraCarga()) {
    <span class="chip-execucao chip-execucao--esqueleto" aria-hidden="true"></span>
} @else if (execucaoAtiva.ativa(); as execucao) {
    <div class="chip-execucao chip-execucao--ativa">
        <a
            routerLink="/execucao"
            class="chip-execucao__corpo"
            [pTooltip]="execucao.descricao || 'Execução em andamento'"
            tooltipPosition="bottom"
        >
            <span class="chip-execucao__ponto" aria-hidden="true"></span>
            <span class="chip-execucao__texto">{{
                execucao.descricao || "Execução em andamento"
            }}</span>
            <span class="chip-execucao__tempo" role="timer" aria-label="Tempo de execução">{{
                cronometro()
            }}</span>
        </a>
        <p-button
            icon="pi pi-pause"
            [text]="true"
            [rounded]="true"
            size="small"
            severity="secondary"
            styleClass="chip-execucao__pausa"
            aria-label="Pausar execução"
            (onClick)="abrirPausa()"
        />
    </div>
} @else {
    <a routerLink="/atividade" class="chip-execucao chip-execucao--vazio">Sem execução ativa</a>
}

<app-execucao-encerrar-dialog #dialogoEncerrar (encerrada)="aposEncerrar($event)" />
