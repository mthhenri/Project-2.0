<nav class="sidebar flex flex-col h-full w-64 bg-surface-0 border-r border-surface-200">
  <ul class="sidebar__lista flex flex-col gap-1 p-3 mt-2">
    @for (item of itensNavegacao; track item.routerLink) {
      <li>
        <a
          [routerLink]="item.routerLink"
          routerLinkActive="sidebar__item--ativo"
          class="sidebar__item flex items-center gap-3 px-3 py-2 rounded-lg text-surface-700 hover:bg-surface-100 transition-colors"
        >
          <i [class]="item.icon"></i>
          <span class="sidebar__item-label text-sm font-medium">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
