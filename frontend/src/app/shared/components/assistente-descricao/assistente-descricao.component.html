<div class="assistente-descricao">
  <span
    class="inline-block"
    [pTooltip]="textoAtual.trim().length < minimoCaracteres ? 'Escreva ao menos ' + minimoCaracteres + ' caracteres para a IA ajudar' : ''"
    tooltipPosition="right"
  >
    <p-button
      label="Auxiliar com IA"
      icon="pi pi-sparkles"
      [loading]="carregandoAuxilio()"
      [disabled]="!podeAuxiliar()"
      (onClick)="auxiliar()"
      styleClass="p-button-outlined p-button-sm"
    />
  </span>

  @if (mostrarComparacao()) {
    <div class="assistente-descricao__comparacao grid grid-cols-2 gap-4 mt-4">
      <p-panel header="Texto original">
        <p class="assistente-descricao__texto whitespace-pre-wrap">{{ textoAtual }}</p>
      </p-panel>
      <p-panel header="Sugestão (editável)">
        <textarea
          pTextarea
          spellcheck="true"
          rows="6"
          class="assistente-descricao__texto w-full"
          [value]="textoAuxiliado()"
          (input)="editarSugestao($event)"
        ></textarea>
      </p-panel>
    </div>

    <div class="assistente-descricao__acoes flex gap-2 mt-3">
      <p-button
        label="Aceitar"
        icon="pi pi-check"
        severity="success"
        (onClick)="aceitar()"
      />
      <p-button
        label="Regenerar"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        [loading]="carregandoAuxilio()"
        (onClick)="auxiliar()"
      />
      <p-button
        label="Descartar"
        icon="pi pi-times"
        severity="secondary"
        (onClick)="descartar()"
      />
    </div>
  }
</div>
