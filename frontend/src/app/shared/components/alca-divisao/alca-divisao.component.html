<div
  class="alca-divisao"
  [class.alca-divisao--arrastando]="arrastando()"
  role="separator"
  aria-orientation="vertical"
  [attr.aria-label]="rotulo()"
  [attr.aria-valuenow]="largura()"
  [attr.aria-valuemin]="minima()"
  [attr.aria-valuemax]="maxima()"
  tabindex="0"
  pTooltip="Arraste para ajustar a largura (duplo clique restaura)"
  tooltipPosition="top"
  (pointerdown)="iniciarArrasto($event)"
  (pointermove)="aoArrastar($event)"
  (pointerup)="finalizarArrasto()"
  (pointercancel)="finalizarArrasto()"
  (keydown)="aoTeclar($event)"
  (dblclick)="restaurar()"
></div>
