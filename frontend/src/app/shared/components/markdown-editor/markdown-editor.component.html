@if (somenteLeitura()) {
  <app-markdown-visualizador [texto]="valor()" />
} @else {
  <div class="markdown-editor" [class.markdown-editor--desabilitado]="desabilitado()">
    <div class="markdown-editor__cabecalho">
      <div class="markdown-editor__barra" role="toolbar" aria-label="Formatação">
        @for (botao of modo() === 'formatado' ? botoesFormatado : botoes; track botao.acao) {
          <button
            type="button"
            class="markdown-editor__botao"
            [class.markdown-editor__botao--ativo]="ativos().has(botao.acao)"
            [attr.aria-label]="botao.rotulo"
            [attr.aria-pressed]="modo() === 'formatado' ? ativos().has(botao.acao) : null"
            [pTooltip]="botao.dica"
            tooltipPosition="top"
            [disabled]="desabilitado()"
            (mousedown)="$event.preventDefault()"
            (click)="executarBotao(botao.acao)"
          >
            <span [class]="botao.classe">{{ botao.glifo }}</span>
          </button>
        }
      </div>

      <button
        type="button"
        class="markdown-editor__modo"
        [class.markdown-editor__modo--ativo]="modo() === 'texto'"
        [attr.aria-pressed]="modo() === 'texto'"
        [attr.aria-label]="modo() === 'texto' ? 'Voltar à edição formatada' : 'Ver e editar o Markdown cru'"
        [pTooltip]="modo() === 'texto' ? 'Voltar à edição formatada' : 'Ver e editar o Markdown cru'"
        tooltipPosition="top"
        (click)="alternarModo()"
      >
        <span class="markdown-editor__glifo--codigo" aria-hidden="true">M↓</span>
      </button>
    </div>

    @if (modo() === 'formatado') {
      <div
        #hospedeFormatado
        class="markdown-editor__formatado"
        [class.markdown-editor__formatado--vazio]="valor().trim() === ''"
        [attr.data-placeholder]="placeholder()"
        [attr.aria-label]="rotulo()"
        [style.min-height.rem]="alturaMinima()"
        (keydown)="aoTeclarFormatado($event)"
        (contextmenu)="aoAbrirMenuContextoFormatado($event)"
      ></div>
    } @else {
      <textarea
        #campo
        class="markdown-editor__campo"
        [value]="valor()"
        [placeholder]="placeholder()"
        [disabled]="desabilitado()"
        [attr.maxlength]="maxlength()"
        [attr.aria-label]="rotulo()"
        [style.min-height.rem]="alturaMinima()"
        spellcheck="true"
        (input)="aoDigitar($event)"
        (keydown)="aoTeclar($event)"
        (keyup)="atualizarSelecao()"
        (mouseup)="atualizarSelecao()"
        (select)="atualizarSelecao()"
        (contextmenu)="aoAbrirMenuContexto($event)"
        (blur)="aoSair()"
      ></textarea>
    }
  </div>
}
