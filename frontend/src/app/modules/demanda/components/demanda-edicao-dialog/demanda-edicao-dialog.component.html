<p-dialog
  header="Editar Demanda"
  [visible]="visivel"
  (visibleChange)="fechar()"
  [modal]="true"
  [style]="{ width: '600px' }"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
>
  @if (carregandoDados()) {
    <div class="demanda-edicao-dialog__carregando">
      <i class="pi pi-spin pi-spinner text-2xl text-muted-color"></i>
    </div>
  }

  @if (!carregandoDados()) {
    <form [formGroup]="formulario" class="demanda-edicao-dialog__form">
      <div class="demanda-edicao-dialog__campo demanda-edicao-dialog__campo--full">
        <label class="demanda-edicao-dialog__label">
          Nome <span class="demanda-edicao-dialog__obrigatorio">*</span>
        </label>
        <input pInputText spellcheck="true" appBloquearCaracteresProibidos formControlName="nome" class="w-full" />
        <small class="block mt-1 text-muted-color">{{ dicaCaracteresProibidos }}</small>
        @if (campoInvalido('nome')) {
          <small class="demanda-edicao-dialog__erro">
            @if (formulario.controls.nome.hasError('pattern')) {
              {{ mensagemCaracteresProibidos }}
            } @else {
              Nome é obrigatório
            }
          </small>
        }
      </div>

      <div class="demanda-edicao-dialog__campo demanda-edicao-dialog__campo--full">
        <label class="demanda-edicao-dialog__label">Demanda Pai</label>
        <p-select
          formControlName="demandaPaiId"
          [options]="demandasPaiOpcoes()"
          optionLabel="caminho"
          optionValue="id"
          placeholder="Nenhuma (demanda raiz)"
          [showClear]="true"
          appendTo="body"
          class="w-full"
        />
      </div>

      <div class="demanda-edicao-dialog__linha">
        <div class="demanda-edicao-dialog__campo">
          <label class="demanda-edicao-dialog__label">Status</label>
          <p-select
            formControlName="status"
            [options]="statusOpcoes"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            class="w-full"
          />
        </div>
        <div class="demanda-edicao-dialog__campo demanda-edicao-dialog__campo--previsao">
          <label class="demanda-edicao-dialog__label">Previsão de Término</label>
          <p-datepicker
            formControlName="previsaoFimData"
            dateFormat="dd/mm/yy"
            [showIcon]="true"
            appendTo="body"
            class="w-full"
          />
        </div>
        <div class="demanda-edicao-dialog__campo demanda-edicao-dialog__campo--horas">
          <label class="demanda-edicao-dialog__label">
            {{ unidadeTempo.emDias() ? 'Dias Estimados' : 'Horas Estimadas' }}
          </label>
          <p-inputnumber
            formControlName="horasEstimadas"
            [min]="0"
            [step]="unidadeTempo.emDias() ? 0.5 : 1"
            [minFractionDigits]="0"
            [maxFractionDigits]="unidadeTempo.emDias() ? 2 : 0"
            [suffix]="unidadeTempo.emDias() ? ' dia(s)' : ''"
            locale="pt-BR"
            [showButtons]="true"
            class="w-full"
            [inputStyle]="{ width: '100%' }"
          />
        </div>
      </div>

      <div class="demanda-edicao-dialog__linha">
        <div class="demanda-edicao-dialog__campo demanda-edicao-dialog__campo--checkbox">
          <p-checkbox formControlName="isEstrutural" [binary]="true" inputId="isEstrutural" />
          <label for="isEstrutural" class="demanda-edicao-dialog__label--checkbox">
            Demanda Estrutural
          </label>
        </div>
      </div>
    </form>
  }

  <ng-template pTemplate="footer">
    <p-button
      label="Cancelar"
      severity="secondary"
      [outlined]="true"
      (onClick)="fechar()"
    />
    <p-button
      label="Salvar"
      icon="pi pi-check"
      [loading]="carregando()"
      [disabled]="carregandoDados()"
      (onClick)="salvar()"
    />
  </ng-template>
</p-dialog>
