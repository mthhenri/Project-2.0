@if (editavel()) {
  <button
    type="button"
    class="demanda-status-chip__gatilho"
    aria-label="Trocar status"
    pTooltip="Trocar status"
    tooltipPosition="top"
    (click)="abrir($event, popover)"
  >
    <p-tag [value]="rotulo(status())" [severity]="severidade(status())" />
  </button>
  <p-popover #popover>
    <div class="demanda-status-chip__opcoes">
      @for (opcao of opcoes; track opcao.value) {
        <button
          type="button"
          class="demanda-status-chip__opcao"
          [class.demanda-status-chip__opcao--ativo]="opcao.value === status()"
          (click)="escolher(opcao.value, popover)"
        >
          <p-tag [value]="opcao.label" [severity]="severidade(opcao.value)" />
          @if (opcao.value === status()) {
            <i class="pi pi-check demanda-status-chip__opcao-check"></i>
          }
        </button>
      }
    </div>
  </p-popover>
} @else {
  <p-tag [value]="rotulo(status())" [severity]="severidade(status())" />
}
