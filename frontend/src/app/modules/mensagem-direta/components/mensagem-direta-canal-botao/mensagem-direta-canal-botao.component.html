@if (podeAbrir()) {
    <p-button
        [label]="rotulo()"
        [icon]="falhou() ? 'pi pi-refresh' : 'pi pi-comments'"
        [severity]="falhou() ? 'warn' : 'secondary'"
        [outlined]="true"
        size="small"
        [loading]="ocupado()"
        [pTooltip]="dica()"
        tooltipPosition="bottom"
        (onClick)="aoClicar()"
    />
}
