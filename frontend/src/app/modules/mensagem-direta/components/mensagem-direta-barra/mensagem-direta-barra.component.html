<nav
    class="barra-direta"
    [class]="'barra-direta--' + posicao().toLowerCase()"
    aria-label="Conversas"
>
    <div class="barra-direta__bolinhas">
        @for (bolinha of bolinhas(); track bolinha.usuarioId) {
            <button
                type="button"
                class="barra-direta__bolinha"
                [class.barra-direta__bolinha--ativa]="bolinha.ativa"
                [class.barra-direta__bolinha--silenciada]="bolinha.silenciada"
                [attr.aria-label]="rotulo(bolinha)"
                [attr.aria-current]="bolinha.ativa ? 'true' : null"
                [pTooltip]="rotulo(bolinha)"
                [tooltipPosition]="ladoDoTooltip()"
                (click)="abrir(bolinha)"
            >
                <app-avatar-usuario
                    [nome]="bolinha.nome"
                    [cor]="bolinha.cor"
                    [online]="bolinha.online"
                    [pequeno]="true"
                />
                @if (bolinha.naoLidas > 0 && !bolinha.ativa) {
                    <span class="barra-direta__contador" aria-hidden="true">{{
                        bolinha.naoLidas > 99 ? "99+" : bolinha.naoLidas
                    }}</span>
                }
            </button>
        }
    </div>
    <app-mensagem-direta-configuracoes-botao lado="top" />
</nav>
