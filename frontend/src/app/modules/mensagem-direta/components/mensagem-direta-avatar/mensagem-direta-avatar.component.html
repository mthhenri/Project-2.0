<span
    class="avatar-direto"
    [class.avatar-direto--pequeno]="pequeno()"
    [style.background]="fundo()"
    [style.color]="corDoTexto()"
    aria-hidden="true"
>
    {{ iniciais() }}
    @if (online() !== null) {
        <span
            class="avatar-direto__presenca"
            [class.avatar-direto__presenca--online]="online()"
        ></span>
    }
</span>
