<p-dialog
    header="Configurar volume"
    [(visible)]="mostrar"
    [modal]="true"
    [style]="{ width: '36rem' }"
    [draggable]="false"
>
    @if (projetoId(); as identificador) {
        @if (mostrar()) {
            <app-projeto-volume-vigencias
                [projetoId]="identificador"
                (alterado)="volumeAlterado.emit()"
            />
        }
    }
</p-dialog>
