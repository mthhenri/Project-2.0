<p-dialog
  [header]="usuario()?.nomeCompleto || 'Perfil'"
  [visible]="mostrarDialog()"
  (visibleChange)="mostrarDialog.set($event)"
  [modal]="true"
  [style]="{ width: '40rem' }"
  [draggable]="false"
  [dismissableMask]="true"
>
  @if (carregando()) {
    <div class="usuario-perfil-dialog__carregando">
      <i class="pi pi-spin pi-spinner text-4xl text-muted-color"></i>
    </div>
  } @else if (usuario(); as usuario) {
    @if (podeEditar()) {
      <div class="usuario-perfil-dialog__acoes">
        <p-button
          label="Editar"
          icon="pi pi-pencil"
          severity="secondary"
          [outlined]="true"
          (onClick)="pedirEdicao(usuario)"
        />
        <p-button
          label="Alterar Senha"
          icon="pi pi-lock"
          severity="secondary"
          [outlined]="true"
          (onClick)="pedirSenha(usuario)"
        />
        @if (podeVerAnotacoes()) {
          <p-button
            label="Anotações"
            icon="pi pi-file-edit"
            [outlined]="true"
            (onClick)="anotacoesDialog.abrir(usuario.id, usuario.nomeCompleto)"
          />
        }
      </div>
    }

    <div class="usuario-perfil-dialog__card">
      <div class="usuario-perfil-dialog__avatar">
        {{ iniciais(usuario.nomeCompleto) }}
      </div>

      <div class="usuario-perfil-dialog__info">
        <div class="usuario-perfil-dialog__campo">
          <span class="usuario-perfil-dialog__campo-label">Login</span>
          <span class="usuario-perfil-dialog__campo-valor">{{ usuario.login }}</span>
        </div>
        <div class="usuario-perfil-dialog__campo">
          <span class="usuario-perfil-dialog__campo-label">Cargo</span>
          <span class="usuario-perfil-dialog__campo-valor">{{ usuario.cargoTitulo }}</span>
        </div>
        <div class="usuario-perfil-dialog__campo">
          <span class="usuario-perfil-dialog__campo-label">Horas diárias</span>
          <span class="usuario-perfil-dialog__campo-valor">{{ usuario.horasDiariasNecessarias }}h</span>
        </div>
        <div class="usuario-perfil-dialog__campo">
          <span class="usuario-perfil-dialog__campo-label">Tipo</span>
          <p-tag
            [value]="rotulaTipo(usuario.tipo)"
            [severity]="severidadeTipo(usuario.tipo)"
          />
        </div>
        <div class="usuario-perfil-dialog__campo">
          <span class="usuario-perfil-dialog__campo-label">Status</span>
          <p-tag
            [value]="usuario.status === 'ATIVO' ? 'Ativo' : 'Inativo'"
            [severity]="severidadeStatus(usuario.status)"
          />
        </div>
      </div>
    </div>
  }
</p-dialog>

<app-usuario-anotacoes-dialog #anotacoesDialog (aoAlterar)="aoAlterar.emit($event)" />
