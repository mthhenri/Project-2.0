<section class="usuario-tipo-descricao" [attr.aria-label]="'Tipo ' + rotulo()">
    <p-tag [value]="rotulo()" [severity]="severidade()" />
    <p class="usuario-tipo-descricao__que">{{ descricao().queE }}</p>

    <h3 class="usuario-tipo-descricao__secao">Pode</h3>
    <ul class="usuario-tipo-descricao__lista">
        @for (item of descricao().pode; track item) {
            <li class="usuario-tipo-descricao__item">
                <i
                    class="pi pi-check usuario-tipo-descricao__marca usuario-tipo-descricao__marca--pode"
                    aria-hidden="true"
                ></i>
                <span>{{ item }}</span>
            </li>
        }
    </ul>

    <h3 class="usuario-tipo-descricao__secao">Não pode</h3>
    <ul class="usuario-tipo-descricao__lista">
        @for (item of descricao().naoPode; track item) {
            <li class="usuario-tipo-descricao__item">
                <i
                    class="pi pi-times usuario-tipo-descricao__marca usuario-tipo-descricao__marca--nao-pode"
                    aria-hidden="true"
                ></i>
                <span>{{ item }}</span>
            </li>
        }
    </ul>
</section>
