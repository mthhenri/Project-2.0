<p-drawer
  [visible]="visivel()"
  (visibleChange)="aoMudarVisibilidade($event)"
  position="right"
  [modal]="true"
  [dismissible]="true"
  [closeOnEscape]="true"
  [showCloseIcon]="false"
  styleClass="anotacoes-drawer"
>
  <ng-template #headless>
    <div
      class="anotacoes-drawer__conteudo"
      (keydown.control.s)="$event.preventDefault(); salvar()"
      (keydown.meta.s)="$event.preventDefault(); salvar()"
    >
      <header class="anotacoes-drawer__cabecalho">
        <div class="anotacoes-drawer__titulos">
          <h2 class="anotacoes-drawer__titulo">{{ titulo() }}</h2>
          <span
            class="anotacoes-drawer__editado"
            [pTooltip]="alteracaoData() ? (alteracaoData() | date: 'dd/MM/yyyy HH:mm:ss') ?? '' : ''"
            tooltipPosition="bottom"
          >
            <i class="pi pi-history"></i>{{ editadoHa() }}
          </span>
        </div>
        <p-button
          icon="pi pi-times"
          [text]="true"
          severity="secondary"
          ariaLabel="Fechar anotações"
          pTooltip="Fechar (Esc) — salva sozinho"
          tooltipPosition="left"
          (onClick)="aoMudarVisibilidade(false)"
        />
      </header>

      @if (carregando()) {
        <div class="anotacoes-drawer__esqueleto" aria-busy="true">
          <p-skeleton height="2rem" />
          <p-skeleton height="1rem" width="90%" />
          <p-skeleton height="1rem" width="75%" />
          <p-skeleton height="1rem" width="85%" />
          <p-skeleton height="1rem" width="60%" />
        </div>
      } @else {
        <form [formGroup]="formulario" class="anotacoes-drawer__form">
          <app-markdown-editor
            #editorMarkdown
            formControlName="anotacoes"
            [alturaMinima]="0"
            rotulo="Anotações"
            placeholder="Escreva aqui — salva sozinho enquanto você digita."
            class="anotacoes-drawer__editor"
          />
        </form>
      }

      <footer class="anotacoes-drawer__rodape">
        <p-button
          label="Limpar"
          icon="pi pi-trash"
          severity="danger"
          [outlined]="true"
          size="small"
          [disabled]="carregando()"
          (onClick)="limpar()"
        />
        <span class="anotacoes-drawer__estado" role="status" aria-live="polite" [attr.data-estado]="estado()">
          @switch (estado()) {
            @case ('editando') { <i class="pi pi-pencil"></i>Editando… }
            @case ('salvando') { <i class="pi pi-spin pi-spinner"></i>Salvando… }
            @case ('salvo') { <i class="pi pi-check"></i>Salvo às {{ salvoEm() | date: 'HH:mm' }} }
            @case ('erro') { <i class="pi pi-exclamation-triangle"></i>Não salvou — tente de novo }
          }
        </span>
        <p-button
          label="Salvar"
          icon="pi pi-save"
          size="small"
          pTooltip="Ctrl+S"
          tooltipPosition="top"
          [disabled]="carregando() || (estado() !== 'editando' && estado() !== 'erro')"
          (onClick)="salvar()"
        />
      </footer>
    </div>
  </ng-template>
</p-drawer>
