<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Project 2.0</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Aplica o tema salvo antes do bootstrap do Angular, evitando flash do tema claro. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('tema') === 'escuro') {
            document.documentElement.classList.add('app-escuro');
          }
        } catch (erro) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
