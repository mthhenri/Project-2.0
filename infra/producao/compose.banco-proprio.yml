# Banco próprio da produção: começa vazio e recebe o gestor inicial pelas migrations. Sem porta publicada.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NOME}
      POSTGRES_USER: ${DB_USUARIO}
      POSTGRES_PASSWORD: ${DB_SENHA}
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO} -d ${DB_NOME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migracoes:
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"

volumes:
  postgres_dados:
