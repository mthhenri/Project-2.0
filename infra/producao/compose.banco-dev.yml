# Usa o PostgreSQL do desenvolvimento (`npm run db:up`), alcançado pela porta publicada na máquina. As migrations da produção rodam nele.
services:
  migracoes:
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  api:
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
